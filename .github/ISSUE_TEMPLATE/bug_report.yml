name: Bug 报告
description: 工具本身报错、崩溃、同步结果异常时使用
title: "bug: "
labels:
  - bug
  - needs-info
body:
  - type: markdown
    attributes:
      value: |
        请尽量完整填写。缺少版本、系统、状态输出或日志时，通常无法判断是工具问题、Codex Desktop 问题，还是 encrypted_content / SQLite 损坏等边界情况。
  - type: input
    id: version
    attributes:
      label: codex-provider-sync 版本
      description: 桌面版请填写 Release 版本（如 v1.0.0）；CLI / Web 请填写 `npm list -g @dailin521/codex-provider-sync` 的版本或源码 commit。桌面与 npm 版本独立发布。
      placeholder: Windows Electron v1.0.0 / npm CLI v0.5.0
    validations:
      required: true
  - type: dropdown
    id: entrypoint
    attributes:
      label: 使用方式
      options:
        - Windows Electron 桌面版
        - 本地 Web UI
        - Legacy .NET 桌面版（Windows / macOS）
        - npm 全局 CLI
        - 仓库源码运行
        - 其它
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统版本
      placeholder: Windows 11 24H2 / Windows 10 / macOS 15.x
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex 使用方式和版本
      description: 例如 Codex Desktop / Codex CLI，以及版本号或大概更新时间。
      placeholder: Codex Desktop，版本未知
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从 Provider 切换、刷新、预览或直接同步、sync/switch 命令开始写，尽量按时间顺序。
      placeholder: |
        1. 关闭 Codex Desktop
        2. 切换 provider 到 ...
        3. 打开工具，在概览点击刷新
        4. 点击直接同步后出现 ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 报错文本、截图文字、终端输出都可以贴这里。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 概览状态 / CLI status 输出
      description: CLI 可运行 `codex-provider status`；桌面 / Web 请附刷新后的概览截图或文字。无需为提交问题执行高级修复。请遮盖个人路径等隐私信息。
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或错误堆栈
      description: Electron 请附“操作日志”中对应操作的结果、错误码和阶段耗时；CLI / Web 请附终端错误。Legacy .NET Windows 日志位于 `%AppData%\codex-provider-sync\logs`，启动错误为同目录上级的 `startup-error.log`。不要上传 auth.json、凭据、聊天正文、原始数据库或备份。
      render: text
    validations:
      required: false
  - type: checkboxes
    id: boundary
    attributes:
      label: 确认事项
      options:
        - label: 我理解普通同步只对齐 Provider 元数据，不处理登录、认证或 auth.json。
          required: true
        - label: 我理解含 encrypted_content 的历史会话跨 provider/account 后可能不能继续对话。
          required: true
        - label: 我理解本工具不会修改 updated_at，也不会通过改变排序来修复 Desktop 显示。
          required: true
