name: publish npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Require the main branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "npm packages may only be published from main."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - run: npm run workspaces:check
      - run: npm run web:build
      - run: npx playwright install --with-deps chromium
      - run: npm run web:test:e2e
      - run: npm test
      - run: npm run package:smoke
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "16.20.2"
          package-manager-cache: false

      - run: npm ci --workspaces=false --omit=dev
      - run: npm run runtime:verify-node16
      - run: npm run package:verify-root-tree
      - run: npm run package:smoke:lifecycle

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm publish --access public
